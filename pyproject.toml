[project]
name = "vericode"
version = "0.1.0"
description = "Offline AI code verification - a Git pre-commit hook that catches hallucinated imports, insecure code, and false-positive noise using a local LLM."
requires-python = ">=3.11"
dependencies = [
    "rich",
    "semgrep",
    "ollama",
    "pre-commit",
    "certifi>=2026.7.22",
    "pybetterleaks>=0.6.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vericode"]
